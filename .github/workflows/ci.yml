name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  code-quality: write

env:
  GOTOOLCHAIN: local
  GOFLAGS: -mod=readonly
  GOVCS: "*:off"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates (linux-amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.5"
          check-latest: false
          cache: false

      - name: Verify controlled Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go1.26.5"
          test "$(go env GOTOOLCHAIN)" = "local"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"

      - name: Run platform source quality
        run: go run -mod=readonly ./cmd/build

      - name: Generate Cobertura coverage
        shell: bash
        run: |
          set -euo pipefail
          go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
          go run -mod=readonly ./cmd/coverage-cobertura \
            --input coverage.out \
            --output coverage.xml \
            --module github.com/CyberT33N/credential-broker-platform

      - name: Upload GitHub code coverage
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@1c15be36fc3733ba839b1dd643bd9556e4426dc1 # v1
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/go
          fail-on-error: "true"
          wait-for-processing-timeout: "160"

      - name: Fuzz configuration boundary
        run: go test -mod=readonly ./internal/config -run=^$ -fuzz=FuzzParseRepository -fuzztime=5000x -parallel=1

      - name: Fuzz broker HTTP boundary
        run: go test -mod=readonly ./internal/broker -run=^$ -fuzz=FuzzTokenRequestBoundary -fuzztime=5000x -parallel=1
